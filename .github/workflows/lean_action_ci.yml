name: Lean proof CI

on:
  push:
    paths:
      - "lean/**"
      - ".github/workflows/lean_action_ci.yml"
  pull_request:
    paths:
      - "lean/**"
      - ".github/workflows/lean_action_ci.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean